<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reverse Words in a Sentence</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #b6a7a7;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container-box {
      background: #c3c7cc;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      text-align: center;
    }

    .result {
      margin-top: 20px;
      font-weight: bold;
      color: #0d6efd;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <div class="container-box">
    <h3 class="mb-3 text-primary">🔁 Reverse Words in a Sentence</h3>
    <p class="text-secondary">Enter a sentence below to reverse each word while keeping their order.</p>

    <div class="input-group mb-3">
      <input type="text" id="sentence" class="form-control" placeholder='e.g. "JavaScript is fun"'>
      <button class="btn btn-primary" id="reverseBtn">Reverse</button>
    </div>

    <div id="output" class="result"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.getElementById('reverseBtn').addEventListener('click', function() {
      const input = document.getElementById('sentence').value.trim();
      const outputDiv = document.getElementById('output');

      if (input === "") {
        outputDiv.textContent = "⚠️ Please enter a sentence!";
        outputDiv.classList.remove('text-primary');
        outputDiv.classList.add('text-danger');
        return;
      }
      const reversedSentence = input
        .split(" ")
        .map(word => word.split("").reverse().join(""))
        .join(" ");

      outputDiv.textContent = reversedSentence;
      outputDiv.classList.remove('text-danger');
      outputDiv.classList.add('text-primary');
    });
  </script>

</body>
</html>
