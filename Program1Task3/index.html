<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Basic Calculator</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    body {
      background-color: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .calculator {
      background: rgb(158, 154, 154);
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
    }
    .btn-operation {
      width: 100%;
      margin-top: 10px;
    }
    #result {
      margin-top: 20px;
      font-size: 1.2rem;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <h3 class="text-center mb-4">Basic Calculator</h3>

    <div class="mb-3">
      <label for="num1" class="form-label">Number 1:</label>
      <input type="number" id="num1" class="form-control" placeholder="Enter first number">
    </div>

    <div class="mb-3">
      <label for="num2" class="form-label">Number 2:</label>
      <input type="number" id="num2" class="form-control" placeholder="Enter second number">
    </div>

    <div class="row">
      <div class="col-6">
        <button class="btn btn-primary btn-operation" onclick="calculate('add')">Add (+)</button>
      </div>
      <div class="col-6">
        <button class="btn btn-success btn-operation" onclick="calculate('subtract')">Subtract (-)</button>
      </div>
      <div class="col-6">
        <button class="btn btn-warning btn-operation" onclick="calculate('multiply')">Multiply (×)</button>
      </div>
      <div class="col-6">
        <button class="btn btn-danger btn-operation" onclick="calculate('divide')">Divide (÷)</button>
      </div>
    </div>

    <div id="result" class="text-primary"></div>
  </div>
  <script>
    function calculate(operation) {
      let num1 = parseFloat(document.getElementById('num1').value);
      let num2 = parseFloat(document.getElementById('num2').value);
      let result;

      if (isNaN(num1) || isNaN(num2)) {
        document.getElementById('result').innerText = "Please enter both numbers.";
        return;
      }

      switch(operation) {
        case 'add':
          result = num1 + num2;
          break;
        case 'subtract':
          result = num1 - num2;
          break;
        case 'multiply':
          result = num1 * num2;
          break;
        case 'divide':
          result = num2 !== 0 ? num1 / num2 : "Cannot divide by zero!";
          break;
      }

      document.getElementById('result').innerText = `Result: ${result}`;
    }
  </script>

</body>
</html>
