<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loop Control Practice (Short)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

  <div class="container">
    <h3 class="text-center mb-4">Loop Control Practice</h3>

    <button class="btn btn-primary btn-sm mb-2" onclick="whileLoop()">While Loop</button>
    <button class="btn btn-success btn-sm mb-2" onclick="doWhileLoop()">Do-While Loop</button>
    <button class="btn btn-warning btn-sm mb-2" onclick="forLoop()">For Loop</button>
    <button class="btn btn-info btn-sm mb-2" onclick="nestedLoop()">Nested For Loop</button>

    <pre id="output" class="mt-3 bg-light p-3 border rounded"></pre>
  </div>

  <script>
    function whileLoop() {
      let i = 1, text = "";
      while (i <= 10) text += i++ + " ";
      document.getElementById("output").textContent = "1️⃣ Numbers: " + text;
    }

    function doWhileLoop() {
      let x;
      do {
        x = prompt("Enter the number 5 to stop:");
      } while (x != 5);
      document.getElementById("output").textContent = "2️⃣ You entered 5 ✅";
    }

    function forLoop() {
      let n = parseInt(prompt("Enter N:")), sum = 0;
      for (let i = 1; i <= n; i++) sum += i;
      document.getElementById("output").textContent = `3️⃣ Sum of first ${n} numbers = ${sum}`;
    }

    function nestedLoop() {
      let num = parseInt(prompt("Enter a number:")), text = "";
      for (let i = 1; i <= 10; i++) text += `${num} x ${i} = ${num * i}\n`;
      document.getElementById("output").textContent = "4️⃣ Multiplication Table:\n" + text;
    }
  </script>
</body>
</html>
