<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Comparison</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    body {
      background-color: #9f9e9f;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      border-radius: 10px;
    }
    #result {
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="card p-4" style="width: 25rem;">
    <h3 class="text-center mb-3">Number Comparison</h3>
    
    <div class="mb-3">
      <label for="userNumber" class="form-label">Enter a number:</label>
      <input type="number" id="userNumber" class="form-control" placeholder="Type your number here">
    </div>

    <button class="btn btn-primary w-100" onclick="compareNumber()">Check</button>

    <p id="result" class="text-center mt-3"></p>
  </div>
  <script>
    const predefinedNumber = 75; 

    function compareNumber() {
      const userNumber = document.getElementById('userNumber').value;
      const result = document.getElementById('result');

      if (userNumber === '') {
        result.textContent = 'Please enter a number.';
        result.className = 'text-center text-warning';
        return;
      }

      const number = parseInt(userNumber);

      if (number < predefinedNumber) {
        result.textContent = 'Too Low';
        result.className = 'text-center text-danger';
      } else if (number > predefinedNumber) {
        result.textContent = 'Too High';
        result.className = 'text-center text-danger';
      } else {
        result.textContent = 'Correct!';
        result.className = 'text-center text-success';
      }
    }
  </script>

</body>
</html>
