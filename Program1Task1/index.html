<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Addition & Subtraction</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background-color: #3eb8ec;
      color: #000000;
    }

    h2 {
      color: #000000;
    }

    input[type="number"] {
      padding: 8px;
      margin: 5px;
      width: 100px;
    }

    button {
      padding: 10px 20px;
      margin: 10px 5px;
      cursor: pointer;
      background-color: #0a139128;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 5px;
    }

    button:hover {
      background-color: #bf023e;
    }

    .output {
      margin-top: 20px;
      font-size: 18px;
      background-color: #ecf0f1;
      padding: 10px;
      border-radius: 5px;
      width: fit-content;
    }
  </style>
</head>
<body>

  <h2>Simple Calculator: Addition & Subtraction</h2>

  <label>Number 1:</label>
  <input type="number" id="num1" placeholder="Enter number"><br>

  <label>Number 2:</label>
  <input type="number" id="num2" placeholder="Enter number"><br>

  <button onclick="performAddition()">Add</button>
  <button onclick="performSubtraction()">Subtract</button>

  <div class="output" id="resultArea"></div>

  <script>
    function getNumbers() {
      const num1 = parseFloat(document.getElementById("num1").value);
      const num2 = parseFloat(document.getElementById("num2").value);
      return { num1, num2 };
    }

    function performAddition() {
      const { num1, num2 } = getNumbers();
      if (isNaN(num1) || isNaN(num2)) {
        displayResult("Please enter valid numbers.");
        return;
      }
      const result = num1 + num2;
      displayResult(`Addition: ${num1} + ${num2} = ${result}`);
    }

    function performSubtraction() {
      const { num1, num2 } = getNumbers();
      if (isNaN(num1) || isNaN(num2)) {
        displayResult("Please enter valid numbers.");
        return;
      }
      const result = num1 - num2;
      displayResult(`Subtraction: ${num1} - ${num2} = ${result}`);
    }

    function displayResult(message) {
      document.getElementById("resultArea").innerText = message;
    }
  </script>

</body>
</html>
